schema_version = "1.3"
source = "https://github.com/Kong/insomnia/pull/9920"
source_type = "pr"

[task]
name = "Kong/insomnia"
description = "I'm extending Insomnia's OpenAPI linting so custom Spectral rulesets work everywhere, not just git-connected projects. Right now cloud-synced and local projects can't apply custom validation rules ..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:kong-insomnia-9920"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Security"
subcategory = "Vulnerability analysis"
objective_labels = ["Implement", "Secure or harden", "Validate"]
artifact_type_labels = ["Codebase", "Security artifact", "Configuration file"]
expert_time_estimate = 7200
junior_time_estimate = 21600
