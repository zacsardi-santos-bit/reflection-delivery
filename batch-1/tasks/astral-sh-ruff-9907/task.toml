schema_version = "1.3"
source = "https://github.com/astral-sh/ruff/pull/9907"
source_type = "pr"

[task]
name = "astral-sh/ruff"
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["rust", "swe"]
metadata = { vendor = "Mercor" }

[environment]
