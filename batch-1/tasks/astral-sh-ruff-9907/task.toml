[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: not solved by opus-4.8 (pass@8 = 0)"
pass_at_k_opus_4_8 = "0/8"
category = "Debugging and Repair"
subcategory = "Runtime bug repair"
objective_labels = ["Fix"]
artifact_type_labels = ["Codebase"]
expert_time_estimate = 3600
junior_time_estimate = 10800
