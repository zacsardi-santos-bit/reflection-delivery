schema_version = "1.3"
source = "https://github.com/Mjolnir-MD/Mjolnir/pull/86"
source_type = "pr"

[task]
name = "Mjolnir-MD/Mjolnir"
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["cpp", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "3/8"
category = "Scientific Computing and Domain Science"
subcategory = "Differential equations and simulation"
objective_labels = ["Fix", "Implement"]
artifact_type_labels = ["Codebase"]
expert_time_estimate = 7200
junior_time_estimate = 21600
