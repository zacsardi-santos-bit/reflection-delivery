schema_version = "1.3"
source = "https://github.com/oxc-project/oxc/pull/22452"
source_type = "pr"

[task]
name = "oxc-project/oxc"
description = "I'm trying to clean up a nasty error experience in our shared oxc utilities. Right now if someone points a formatter or linter at a TypeScript config file while running a Node.js version that can't..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:oxc-project-oxc-22452"
