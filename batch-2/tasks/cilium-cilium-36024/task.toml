schema_version = "1.3"
source = "https://github.com/cilium/cilium/pull/36024"
source_type = "pr"

[task]
name = "cilium/cilium"
description = "I'm chasing down some IPv6 Neighbor Discovery bugs in the BPF datapath, the code that handles NS/NA in the network device path (Cilium style). Couple of correctness issues plus some test scaffoldin..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["c", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:cilium-cilium-36024"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8=0)"
pass_at_k_opus_4_8 = "0/8"
category = "Debugging and Repair"
subcategory = "Runtime bug repair"
objective_labels = ["Fix", "Implement"]
artifact_type_labels = ["Codebase", "Network endpoint or protocol artifact"]
expert_time_estimate = 3600
junior_time_estimate = 10800
