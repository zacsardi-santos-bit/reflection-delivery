schema_version = "1.3"
source = "https://github.com/vercel/turborepo/pull/12073"
source_type = "pr"

[task]
name = "vercel/turborepo"
description = "I'm chasing a bug in our Rust monorepo build tool, specifically the lockfile pruning code that takes a full monorepo lockfile and spits out a minimal subset lockfile for a given set of workspace pa..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["rust", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:vercel-turborepo-12073"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8 = 0)"
pass_at_k_opus_4_8 = "0/8"
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
objective_labels = ["Implement", "Fix", "Test"]
artifact_type_labels = ["Codebase", "Configuration file", "Test suite or benchmark"]
expert_time_estimate = 3600
