schema_version = "1.3"
source = "https://github.com/argoproj/argo-cd/pull/26544"
source_type = "pr"

[task]
name = "argoproj/argo-cd"
description = "I'm hitting a bug in Argo CD's repo server around how Helm app details get populated for multi-source apps. You know the pattern where value files live in a separate external repo and get reference..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["go", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:argoproj-argo-cd-26544"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "6/13"
category = "Debugging and Repair"
subcategory = "Runtime bug repair"
objective_labels = ["Fix", "Implement", "Refactor"]
artifact_type_labels = ["Codebase", "Service or daemon"]
expert_time_estimate = 3600
junior_time_estimate = 10800
