schema_version = "1.3"
source = "https://github.com/docling-project/docling/pull/3554"
source_type = "pr"

[task]
name = "docling-project/docling"
description = "I'm hitting a few related gaps in the document conversion service client and want to knock them out together."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "1/8"
category = "Software Engineering"
subcategory = "Web, API, and networking software"
objective_labels = ["Implement", "Fix", "Secure or harden", "Optimize"]
artifact_type_labels = ["Codebase", "Network endpoint or protocol artifact"]
expert_time_estimate = 7200
junior_time_estimate = 21600
