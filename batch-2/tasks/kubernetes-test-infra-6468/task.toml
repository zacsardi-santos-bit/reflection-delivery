schema_version = "1.3"
source = "https://github.com/kubernetes/test-infra/pull/6468"
source_type = "pr"

[task]
name = "kubernetes/test-infra"
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "1/8"
category = "Systems, Infrastructure, and Operations"
subcategory = "Scheduling and automation infrastructure"
objective_labels = ["Configure", "Implement", "Fix"]
artifact_type_labels = ["Configuration file", "Codebase", "Service or daemon"]
expert_time_estimate = 3600
junior_time_estimate = 10800
