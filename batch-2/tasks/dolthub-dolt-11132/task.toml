schema_version = "1.3"
source = "https://github.com/dolthub/dolt/pull/11132"
source_type = "pr"

[task]
name = "dolthub/dolt"
description = "I'm chasing a really nasty data corruption bug in Dolt that only bites people who created tables on an older version and then upgraded. The newer version picked a different default storage encoding..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["go", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:dolthub-dolt-11132"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
objective_labels = ["Fix", "Implement"]
artifact_type_labels = ["Codebase", "Database or structured store"]
expert_time_estimate = 7200
junior_time_estimate = 21600
