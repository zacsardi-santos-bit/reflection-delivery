schema_version = "1.3"
source = "https://github.com/google-gemini/gemini-cli/pull/22680"
source_type = "pr"

[task]
name = "google-gemini/gemini-cli"
description = "I'm digging into our sandbox execution code and found a real security hole I want closed. Right now callers can hand in sanitization config that flat out disables env var redaction, so secrets, API..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:google-gemini-gemini-cli-22680"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "2/8"
category = "Security"
subcategory = "Security hardening"
objective_labels = ["Implement", "Secure or harden"]
artifact_type_labels = ["Codebase", "Security artifact"]
expert_time_estimate = 7200
junior_time_estimate = 21600
