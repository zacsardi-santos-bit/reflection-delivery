schema_version = "1.3"
source = "https://github.com/marimo-team/marimo/pull/9133"
source_type = "pr"

[task]
name = "marimo-team/marimo"
description = "I'm fixing a security hole in the marimo frontend where a few of our plugin components blindly inject script and link elements using whatever URL shows up in widget config or HTML attributes, no va..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:marimo-team-marimo-9133"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "2/13"
category = "Security"
subcategory = "Vulnerability analysis"
objective_labels = ["Refactor", "Secure or harden", "Fix"]
