schema_version = "1.3"
source = "https://github.com/microsoft/semantic-kernel/pull/7049"
source_type = "pr"

[task]
name = "microsoft/semantic-kernel"
description = "I'm on the Semantic Kernel Python SDK and we've got connectors for OpenAI, Azure OpenAI, and a bunch of others, but there's nothing for Mistral AI and I want to use their models for chat completion..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:microsoft-semantic-kernel-7049"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Machine Learning and AI"
subcategory = "NLP and language models"
objective_labels = ["Implement", "Configure", "Build or package"]
artifact_type_labels = ["Codebase", "Build system or package metadata", "Configuration file"]
expert_time_estimate = 7200
junior_time_estimate = 21600
