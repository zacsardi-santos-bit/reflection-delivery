schema_version = "1.3"
source = "https://github.com/riverqueue/river/pull/1155"
source_type = "pr"

[task]
name = "riverqueue/river"
description = "I'm trying to run River behind a connection pooler (PgBouncer in transaction pooling mode) and it's blowing up. That mode forces a simple query protocol that has no support for extended binary enco..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["go", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:riverqueue-river-1155"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "1/13"
category = "Data Querying and Databases"
subcategory = "Database administration"
objective_labels = ["Implement", "Fix"]
artifact_type_labels = ["Codebase", "Database or structured store"]
expert_time_estimate = 7200
