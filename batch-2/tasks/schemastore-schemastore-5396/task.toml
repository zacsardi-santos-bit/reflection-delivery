schema_version = "1.3"
source = "https://github.com/SchemaStore/schemastore/pull/5396"
source_type = "pr"

[task]
name = "SchemaStore/schemastore"
description = "I keep hitting spurious validation errors on my Bamboo pipeline YAML files. I maintain a bunch of these CI/CD definitions as code and rely on the bamboo-spec JSON schema for editor autocomplete and..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["javascript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:schemastore-schemastore-5396"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8=0)"
pass_at_k_opus_4_8 = "0/13"
category = "Data Processing and ETL"
subcategory = "Data validation"
objective_labels = ["Refactor", "Validate", "Configure"]
artifact_type_labels = ["Single script or program", "Configuration file", "Text or log file"]
expert_time_estimate = 7200
junior_time_estimate = 21600
