schema_version = "1.3"
source = "https://github.com/google-gemini/gemini-cli/pull/22737"
source_type = "pr"

[task]
name = "google-gemini/gemini-cli"
description = "I'm cleaning up the plan mode feature in this CLI tool and it's got a couple of rough edges I want fixed. Right now when the model wants to finalize and exit plan mode, it has to hand over a full r..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "2/8"
category = "Software Engineering"
subcategory = "Feature implementation"
objective_labels = ["Implement", "Validate", "Secure or harden"]
artifact_type_labels = ["Codebase", "Single script or program"]
expert_time_estimate = 3600
junior_time_estimate = 10800
