schema_version = "1.3"
source = "https://github.com/astral-sh/ruff/pull/23912"
source_type = "pr"

[task]
name = "astral-sh/ruff"
description = "I'm hitting a nasty crash in the linter and I think it's in the type resolution path. If I write a function whose parameter has a type annotation that's a quoted string which itself wraps another q..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["rust", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Debugging and Repair"
subcategory = "Runtime bug repair"
objective_labels = ["Fix", "Refactor"]
artifact_type_labels = ["Codebase", "Test suite or benchmark"]
expert_time_estimate = 3600
junior_time_estimate = 10800
