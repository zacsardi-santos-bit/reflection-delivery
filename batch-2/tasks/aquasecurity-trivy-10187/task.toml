schema_version = "1.3"
source = "https://github.com/aquasecurity/trivy/pull/10187"
source_type = "pr"

[task]
name = "aquasecurity/trivy"
description = "I'm working on the Maven dependency scanner and hit a real gap: it reads Maven settings files to discover repo configs but totally ignores proxy entries. In a lot of corporate and CI setups all out..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["go", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:aquasecurity-trivy-10187"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8=0)"
pass_at_k_opus_4_8 = "0/13"
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
objective_labels = ["Implement", "Configure", "Test"]
artifact_type_labels = ["Codebase", "Configuration file", "Test suite or benchmark"]
expert_time_estimate = 7200
junior_time_estimate = 21600
