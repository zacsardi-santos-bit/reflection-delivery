schema_version = "1.3"
source = "https://github.com/github/gh-gei/pull/1417"
source_type = "pr"

[task]
name = "github/gh-gei"
description = "I'm building out a CLI that migrates Azure DevOps pipelines over to GitHub, and right now there's a scary gap: no way to test whether a pipeline will actually work once it's pointed at a GitHub rep..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["csharp", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8 = 0)"
pass_at_k_opus_4_8 = "0/8"
category = "Software Engineering"
subcategory = "Feature implementation"
objective_labels = ["Implement", "Test"]
artifact_type_labels = ["Codebase", "Text or log file", "Single script or program"]
expert_time_estimate = 7200
junior_time_estimate = 21600
