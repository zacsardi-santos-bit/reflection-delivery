schema_version = "1.3"
source = "https://github.com/pola-rs/polars/pull/26968"
source_type = "pr"

[task]
name = "pola-rs/polars"
description = "I ran into something annoying with windowed expressions in polars. When I do an `over(...)` and accidentally pass the same column name more than once as a partition key, it just silently accepts it..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:pola-rs-polars-26968"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Data Querying and Databases"
subcategory = "Analytical queries"
objective_labels = ["Implement", "Validate"]
artifact_type_labels = ["Codebase"]
expert_time_estimate = 3600
junior_time_estimate = 10800
