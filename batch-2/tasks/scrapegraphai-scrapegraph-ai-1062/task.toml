schema_version = "1.3"
source = "https://github.com/ScrapeGraphAI/Scrapegraph-ai/pull/1062"
source_type = "pr"

[task]
name = "ScrapeGraphAI/Scrapegraph-ai"
description = "I'm working on ScrapeGraphAI and want to add a lighter-weight document loader as an alternative to our Chromium-based one, since Chromium eats like 300MB per session, needs a full browser install, ..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:scrapegraphai-scrapegraph-ai-1062"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "2/13"
category = "Data Processing and ETL"
