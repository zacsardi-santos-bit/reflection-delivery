schema_version = "1.3"
source = "https://github.com/apache/airflow/pull/63673"
source_type = "pr"

[task]
name = "apache/airflow"
description = "I'm hitting an encoding crash when reading pod logs asynchronously from Kubernetes. Whenever a container emits bytes that aren't valid UTF-8, like binary data, mixed or non-UTF-8 encodings, or trun..."
