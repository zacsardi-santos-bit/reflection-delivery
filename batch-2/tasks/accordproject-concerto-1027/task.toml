schema_version = "1.3"
source = "https://github.com/accordproject/concerto/pull/1027"
source_type = "pr"

[task]
name = "accordproject/concerto"
description = "I'm working on the Concerto model linter and it's got a gap that's driving me nuts: it doesn't flag any naming problems at all. When I run it against a model, declaration names, property names, enu..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Data Processing and ETL"
subcategory = "Data validation"
objective_labels = ["Implement", "Validate", "Build or package"]
artifact_type_labels = ["Codebase", "Build system or package metadata", "Configuration file"]
expert_time_estimate = 3600
junior_time_estimate = 10800
