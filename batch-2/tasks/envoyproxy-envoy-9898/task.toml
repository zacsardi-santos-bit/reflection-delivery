[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "2/8"
category = "Systems, Infrastructure, and Operations"
subcategory = "Networking configuration"
objective_labels = ["Implement", "Refactor"]
artifact_type_labels = ["Codebase", "Network endpoint or protocol artifact"]
expert_time_estimate = 3600
junior_time_estimate = 10800
