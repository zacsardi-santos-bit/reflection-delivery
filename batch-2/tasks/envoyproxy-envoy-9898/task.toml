schema_version = "1.3"
source = "https://github.com/envoyproxy/envoy/pull/9898"
source_type = "pr"

[task]
name = "envoyproxy/envoy"
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["cpp", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
