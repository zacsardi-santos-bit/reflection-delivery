schema_version = "1.3"
source = "https://github.com/prisma/prisma/pull/29389"
source_type = "pr"

[task]
name = "prisma/prisma"
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8 = 0)"
pass_at_k_opus_4_8 = "0/8"
category = "Software Engineering"
subcategory = "Web, API, and networking software"
objective_labels = ["Implement", "Refactor", "Secure or harden"]
artifact_type_labels = ["Codebase", "Service or daemon", "Network endpoint or protocol artifact", "Build system or package metadata"]
expert_time_estimate = 7200
junior_time_estimate = 21600
