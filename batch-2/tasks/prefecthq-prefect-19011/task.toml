schema_version = "1.3"
source = "https://github.com/PrefectHQ/prefect/pull/19011"
source_type = "pr"

[task]
name = "PrefectHQ/prefect"
description = "I'm adding text search to Prefect's events and logs because right now you can only filter by structured stuff like resource ID, time range, or log level, and there's no way to just type a keyword a..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:prefecthq-prefect-19011"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "13/17"
category = "Data Processing and ETL"
