schema_version = "1.3"
source = "https://github.com/apache/pinot/pull/14727"
source_type = "pr"

[task]
name = "apache/pinot"
description = "I'm hitting two group-by aggregation problems in Pinot and want both sorted out. First one's a straight-up crash: when I run a group-by query with a limit on the number of groups and that limit end..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["java", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:apache-pinot-14727"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Data Querying and Databases"
subcategory = "Query optimization"
objective_labels = ["Fix", "Implement", "Configure", "Optimize"]
artifact_type_labels = ["Codebase", "Configuration file"]
expert_time_estimate = 3600
junior_time_estimate = 10800
