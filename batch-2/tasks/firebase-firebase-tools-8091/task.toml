schema_version = "1.3"
source = "https://github.com/firebase/firebase-tools/pull/8091"
source_type = "pr"

[task]
name = "firebase/firebase-tools"
description = "I'm bumping the JSON schema validation library we use for firebase config validation up to a newer major version because I need it to play nice with newer TypeScript tooling, but the upgrade broke ..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "2/8"
category = "Build, Dependency, and Release Management"
subcategory = "Dependency and lockfile resolution"
objective_labels = ["Migrate", "Fix", "Configure"]
artifact_type_labels = ["Build system or package metadata", "Configuration file"]
expert_time_estimate = 3600
junior_time_estimate = 10800
