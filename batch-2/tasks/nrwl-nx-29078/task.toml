schema_version = "1.3"
source = "https://github.com/nrwl/nx/pull/29078"
source_type = "pr"

[task]
name = "nrwl/nx"
description = "I'm working in the Nx monorepo and I keep running into package.json drift across our publishable projects. We've got a ton of packages and there's nothing enforcing our org's package.json standards..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:nrwl-nx-29078"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "2/8"
category = "Data Processing and ETL"
subcategory = "Data validation"
objective_labels = ["Implement", "Validate", "Configure"]
artifact_type_labels = ["Codebase", "Build system or package metadata", "Configuration file"]
expert_time_estimate = 7200
junior_time_estimate = 21600
