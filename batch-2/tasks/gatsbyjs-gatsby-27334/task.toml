schema_version = "1.3"
source = "https://github.com/gatsbyjs/gatsby/pull/27334"
source_type = "pr"

[task]
name = "gatsbyjs/gatsby"
description = "I'm building a Gatsby plugin and I've got a schema describing what options it accepts, types, which ones are required, all that. I want to unit test that my schema actually rejects bad option value..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:gatsbyjs-gatsby-27334"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "10/17"
category = "Data Processing and ETL"
subcategory = "Data validation"
objective_labels = ["Implement", "Validate"]
artifact_type_labels = ["Codebase", "Single script or program"]
expert_time_estimate = 3600
