schema_version = "1.3"
source = "https://github.com/browser-use/browser-use/pull/2111"
source_type = "pr"

[task]
name = "browser-use/browser-use"
description = "I'm cleaning up the file system module our browser agents use internally, it's got a bunch of API inconsistencies that keep biting me, mostly around save/restore state across sessions being flaky."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:browser-use-browser-use-2111"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "13/17"
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
objective_labels = ["Refactor", "Implement", "Fix"]
artifact_type_labels = ["Codebase", "Single script or program"]
expert_time_estimate = 7200
junior_time_estimate = 21600
