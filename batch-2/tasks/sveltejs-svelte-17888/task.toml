schema_version = "1.3"
source = "https://github.com/sveltejs/svelte/pull/17888"
source_type = "pr"

[task]
name = "sveltejs/svelte"
description = "I'm hitting a nasty reactivity bug in Svelte where a rendering error during a synchronous state update permanently wrecks everything after it. I've got a conditional block that can fail at runtime,..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["javascript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:sveltejs-svelte-17888"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "4/8"
category = "Debugging and Repair"
subcategory = "Runtime bug repair"
objective_labels = ["Fix", "Implement"]
artifact_type_labels = ["Codebase"]
expert_time_estimate = 3600
junior_time_estimate = 10800
