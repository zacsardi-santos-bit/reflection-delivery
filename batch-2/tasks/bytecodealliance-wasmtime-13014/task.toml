schema_version = "1.3"
source = "https://github.com/bytecodealliance/wasmtime/pull/13014"
source_type = "pr"

[task]
name = "bytecodealliance/wasmtime"
description = "I've been chasing a nasty correctness and security bug in the Winch baseline compiler around how it generates code for memory access on 64-bit platforms. When it computes a final linear memory addr..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["rust", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:bytecodealliance-wasmtime-13014"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "1/13"
category = "Security"
subcategory = "Vulnerability analysis"
objective_labels = ["Fix", "Secure or harden"]
artifact_type_labels = ["Codebase", "Security artifact"]
expert_time_estimate = 3600
junior_time_estimate = 10800
