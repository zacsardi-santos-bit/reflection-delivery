schema_version = "1.3"
source = "https://github.com/OpenAPITools/openapi-generator/pull/21165"
source_type = "pr"

[task]
name = "OpenAPITools/openapi-generator"
description = "I'm poking at the Kotlin Misk server code generator and there's a handful of config knobs I keep wishing existed. First one, I want a configurable path prefix that gets prepended to all the generat..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["java", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:openapitools-openapi-generator-21165"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "1/8"
category = "Software Engineering"
subcategory = "Compilers, interpreters, and programming languages"
objective_labels = ["Implement", "Configure"]
artifact_type_labels = ["Codebase", "Configuration file"]
expert_time_estimate = 3600
junior_time_estimate = 10800
