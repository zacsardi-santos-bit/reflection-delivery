cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "3/8"
category = "Build, Dependency, and Release Management"
subcategory = "CI/CD pipelines"
objective_labels = ["Configure", "Fix"]
artifact_type_labels = ["Configuration file", "Build system or package metadata"]
expert_time_estimate = 7200
junior_time_estimate = 21600
