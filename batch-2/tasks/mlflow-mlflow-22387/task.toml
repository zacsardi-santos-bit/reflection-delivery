schema_version = "1.3"
source = "https://github.com/mlflow/mlflow/pull/22387"
source_type = "pr"

[task]
name = "mlflow/mlflow"
description = "I'm knee-deep in the multi-workspace stuff and hit a cluster of routing/navigation bugs I want to fix in one pass."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:mlflow-mlflow-22387"
