schema_version = "1.3"
source = "https://github.com/apache/ozone/pull/8699"
source_type = "pr"

[task]
name = "apache/ozone"
description = "I'm cleaning up the Recon service in our Apache Ozone tree and the key listing endpoint bugs me. Right now every key we return gets wrapped in this heavyweight object that carries the full protobuf..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["java", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:apache-ozone-8699"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8=0)"
pass_at_k_opus_4_8 = "0/8"
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
objective_labels = ["Implement", "Refactor"]
artifact_type_labels = ["Codebase", "Network endpoint or protocol artifact"]
expert_time_estimate = 3600
junior_time_estimate = 10800
