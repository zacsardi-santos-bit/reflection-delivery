schema_version = "1.3"
source = "https://github.com/withastro/starlight/pull/2582"
source_type = "pr"

[task]
name = "withastro/starlight"
description = "I'm maintaining the Starlight Tailwind integration package (over in `@packages/tailwind`) and one of the snapshot tests is red. It's the one that checks the full CSS output we produce when Tailwind..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:withastro-starlight-2582"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "1/8"
category = "Build, Dependency, and Release Management"
subcategory = "Dependency and lockfile resolution"
objective_labels = ["Migrate", "Configure", "Build or package"]
artifact_type_labels = ["Build system or package metadata", "Configuration file"]
expert_time_estimate = 3600
junior_time_estimate = 10800
