schema_version = "1.3"
source = "https://github.com/grpc-ecosystem/grpc-gateway/pull/6673"
source_type = "pr"

[task]
name = "grpc-ecosystem/grpc-gateway"
description = "I'm working on the OpenAPI v3 generator for gRPC services and it's got a gap I need to close around visibility filtering. Right now it dumps every service, method, field, and enum value from the pr..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["go", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Build, Dependency, and Release Management"
subcategory = "Dependency and lockfile resolution"
objective_labels = ["Configure", "Build or package", "Migrate"]
artifact_type_labels = ["Build system or package metadata", "Configuration file"]
expert_time_estimate = 7200
junior_time_estimate = 21600
