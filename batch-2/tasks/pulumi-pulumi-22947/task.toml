schema_version = "1.3"
source = "https://github.com/pulumi/pulumi/pull/22947"
source_type = "pr"

[task]
name = "pulumi/pulumi"
description = "I'm trying to add a knob to the deployment engine that skips the up-front plugin pre-installation phase. Right now when a deployment runs, the engine asks the language host for all required package..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["go", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Software Engineering"
subcategory = "Feature implementation"
objective_labels = ["Implement", "Configure"]
artifact_type_labels = ["Codebase", "Single script or program"]
expert_time_estimate = 3600
junior_time_estimate = 10800
