schema_version = "1.3"
source = "https://github.com/google-gemini/gemini-cli/pull/27315"
source_type = "pr"

[task]
name = "google-gemini/gemini-cli"
description = "I'm cleaning up the model fallback system and it needs some upgrades. Right now when a model fails and we swap to an alternative, we just record the new active model but we don't track which model ..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:google-gemini-gemini-cli-27315"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "3/8"
category = "Machine Learning and AI"
subcategory = "ML serving and deployment"
objective_labels = ["Implement", "Fix"]
artifact_type_labels = ["Codebase", "Model or checkpoint"]
expert_time_estimate = 7200
junior_time_estimate = 21600
