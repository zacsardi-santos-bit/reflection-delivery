schema_version = "1.3"
source = "https://github.com/jesseduffield/lazygit/pull/5599"
source_type = "pr"

[task]
name = "jesseduffield/lazygit"
description = "I hit a regression in the cherry-pick workflow and it's driving me nuts. Here's the deal: if I cherry-pick a single commit off a source branch's commit list and then switch over to the target branc..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["go", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:jesseduffield-lazygit-5599"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Debugging and Repair"
subcategory = "Runtime bug repair"
objective_labels = ["Fix"]
artifact_type_labels = ["Codebase"]
expert_time_estimate = 3600
junior_time_estimate = 10800
