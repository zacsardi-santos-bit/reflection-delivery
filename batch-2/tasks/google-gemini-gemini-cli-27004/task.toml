schema_version = "1.3"
source = "https://github.com/google-gemini/gemini-cli/pull/27004"
source_type = "pr"

[task]
name = "google-gemini/gemini-cli"
description = "I'm hitting a bunch of sandbox problems on Linux and they all trace back to how my host user gets mapped into the container. First off the distro detection is way too narrow, it only knows a handfu..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Systems, Infrastructure, and Operations"
subcategory = "Containers and orchestration"
objective_labels = ["Fix", "Implement", "Secure or harden", "Configure"]
artifact_type_labels = ["Codebase", "Container or virtual environment", "Single script or program"]
expert_time_estimate = 7200
junior_time_estimate = 21600
