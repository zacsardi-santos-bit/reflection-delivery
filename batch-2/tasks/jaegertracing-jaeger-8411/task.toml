schema_version = "1.3"
source = "https://github.com/jaegertracing/jaeger/pull/8411"
source_type = "pr"

[task]
name = "jaegertracing/jaeger"
description = "I'm adding metrics support to the ClickHouse storage backend in Jaeger and right now there's just no metrics reader for ClickHouse at all, so when someone configures Jaeger with ClickHouse and trie..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["go", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:jaegertracing-jaeger-8411"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "1/8"
category = "Machine Learning and AI"
subcategory = "Model evaluation and benchmarking"
objective_labels = ["Implement", "Fix"]
artifact_type_labels = ["Codebase", "Database or structured store"]
expert_time_estimate = 7200
junior_time_estimate = 21600
