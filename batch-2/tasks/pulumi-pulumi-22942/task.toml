schema_version = "1.3"
source = "https://github.com/pulumi/pulumi/pull/22942"
source_type = "pr"

[task]
name = "pulumi/pulumi"
description = "I'm hitting a nasty data-loss bug in how Pulumi handles map properties with certain special keys. When a resource property map has nested map values whose keys start with our internal-use prefix, t..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["go", "swe"]
metadata = { vendor = "Mercor" }

[environment]
