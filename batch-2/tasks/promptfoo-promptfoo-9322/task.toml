schema_version = "1.3"
source = "https://github.com/promptfoo/promptfoo/pull/9322"
source_type = "pr"

[task]
name = "promptfoo/promptfoo"
description = "I want to be able to slap key-value tags onto an eval run straight from the CLI, stuff like the environment name or a CI build identifier, without editing my shared config file every time. Right no..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:promptfoo-promptfoo-9322"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Software Engineering"
subcategory = "Feature implementation"
objective_labels = ["Implement", "Configure"]
