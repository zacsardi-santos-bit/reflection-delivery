schema_version = "1.3"
source = "https://github.com/mochajs/mocha/pull/5165"
source_type = "pr"

[task]
name = "mochajs/mocha"
description = "I'm bumping the arg parsing library that mocha's CLI leans on to a new major version and it's breaking everything. The old code pulls the library in through a subpath import and calls a state-reset..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["javascript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:mochajs-mocha-5165"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8=0)"
pass_at_k_opus_4_8 = "0/8"
category = "Build, Dependency, and Release Management"
subcategory = "Dependency and lockfile resolution"
objective_labels = ["Migrate", "Build or package", "Fix"]
artifact_type_labels = ["Codebase", "Build system or package metadata"]
expert_time_estimate = 3600
junior_time_estimate = 10800
