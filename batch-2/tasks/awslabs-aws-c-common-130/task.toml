schema_version = "1.3"
source = "https://github.com/awslabs/aws-c-common/pull/130"
source_type = "pr"

[task]
name = "awslabs/aws-c-common"
description = "I'm cleaning up API inconsistencies in our C byte buffer library before it gets widely deployed, since inconsistent arg ordering causes bugs when callers accidentally swap same-typed args, and nami..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["c", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:awslabs-aws-c-common-130"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8 = 0)"
pass_at_k_opus_4_8 = "0/8"
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
objective_labels = ["Refactor", "Implement", "Migrate"]
artifact_type_labels = ["Codebase", "Binary executable or library"]
expert_time_estimate = 7200
junior_time_estimate = 21600
