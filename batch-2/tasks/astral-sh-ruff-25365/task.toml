schema_version = "1.3"
source = "https://github.com/astral-sh/ruff/pull/25365"
source_type = "pr"

[task]
name = "astral-sh/ruff"
description = "I'm cleaning up some edge cases in our language server's request handling and hitting a few rough spots. The core issue is that requests can arrive for files the server doesn't actually have open, ..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["rust", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:astral-sh-ruff-25365"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Debugging and Repair"
subcategory = "Runtime bug repair"
objective_labels = ["Fix", "Implement", "Refactor"]
artifact_type_labels = ["Service or daemon", "Network endpoint or protocol artifact", "Codebase"]
expert_time_estimate = 3600
junior_time_estimate = 10800
