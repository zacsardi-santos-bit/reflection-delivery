schema_version = "1.3"
source = "https://github.com/alibaba/spring-cloud-alibaba/pull/3659"
source_type = "pr"

[task]
name = "alibaba/spring-cloud-alibaba"
description = "I'm putting together a new AI chat integration module for our Spring Cloud Alibaba project, basically letting Spring Cloud microservices talk to a large-language-model chat service, and I need a pr..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["java", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8 = 0)"
pass_at_k_opus_4_8 = "0/8"
category = "Machine Learning and AI"
subcategory = "ML serving and deployment"
objective_labels = ["Implement", "Configure", "Build or package"]
artifact_type_labels = ["Codebase", "Build system or package metadata", "Configuration file"]
expert_time_estimate = 3600
junior_time_estimate = 10800
