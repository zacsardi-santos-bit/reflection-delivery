schema_version = "1.3"
source = "https://github.com/awslabs/mcp/pull/2523"
source_type = "pr"

[task]
name = "awslabs/mcp"
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "3/8"
category = "Systems, Infrastructure, and Operations"
subcategory = "OS, process, and service management"
objective_labels = ["Implement", "Validate"]
artifact_type_labels = ["Codebase", "Service or daemon", "Network endpoint or protocol artifact"]
expert_time_estimate = 7200
junior_time_estimate = 21600
