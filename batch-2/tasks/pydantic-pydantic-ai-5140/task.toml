schema_version = "1.3"
source = "https://github.com/pydantic/pydantic-ai/pull/5140"
source_type = "pr"

[task]
name = "pydantic/pydantic-ai"
description = "I'm building long-running agentic loops with some Anthropic models and I want to hand the model a loop-wide token budget so it can pace itself and wrap up gracefully as the budget runs low. Anthrop..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:pydantic-pydantic-ai-5140"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Machine Learning and AI"
subcategory = "ML serving and deployment"
objective_labels = ["Implement", "Fix", "Validate"]
artifact_type_labels = ["Codebase", "Configuration file"]
expert_time_estimate = 7200
junior_time_estimate = 21600
