schema_version = "1.3"
source = "https://github.com/tortoise/tortoise-orm/pull/1837"
source_type = "pr"

[task]
name = "tortoise/tortoise-orm"
description = "I'm updating tortoise-orm so it works with the new major version of the SQL query-building library (pypika-style) it depends on, and right now a bunch of stuff is broken because the SQL generation ..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:tortoise-tortoise-orm-1837"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "1/8"
category = "Build, Dependency, and Release Management"
subcategory = "Dependency and lockfile resolution"
objective_labels = ["Migrate", "Fix", "Configure"]
artifact_type_labels = ["Codebase", "Build system or package metadata"]
expert_time_estimate = 3600
junior_time_estimate = 10800
