schema_version = "1.3"
source = "https://github.com/Consensys/teku/pull/8141"
source_type = "pr"

[task]
name = "Consensys/teku"
description = "I'm dealing with a spot in Teku where the beacon node has no clue that the old ETH1-based deposit mechanism has been superseded by the newer deposit approach that recent network upgrades brought in..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["java", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:consensys-teku-8141"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "1/8"
category = "Systems, Infrastructure, and Operations"
subcategory = "Scheduling and automation infrastructure"
objective_labels = ["Implement", "Refactor", "Configure"]
artifact_type_labels = ["Service or daemon", "Codebase"]
expert_time_estimate = 3600
junior_time_estimate = 10800
