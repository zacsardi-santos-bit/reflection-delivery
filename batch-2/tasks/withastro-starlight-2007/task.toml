schema_version = "1.3"
source = "https://github.com/withastro/starlight/pull/2007"
source_type = "pr"

[task]
name = "withastro/starlight"
description = "I'm working on the Starlight Tailwind integration and the CSS we generate for dark mode utilities has drifted from what the current Tailwind CSS library actually emits, so our expected output is st..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:withastro-starlight-2007"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "2/8"
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
objective_labels = ["Fix", "Migrate", "Configure"]
artifact_type_labels = ["Codebase", "Build system or package metadata", "Generated output artifact"]
expert_time_estimate = 3600
junior_time_estimate = 10800
