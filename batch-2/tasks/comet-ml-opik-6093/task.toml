schema_version = "1.3"
source = "https://github.com/comet-ml/opik/pull/6093"
source_type = "pr"

[task]
name = "comet-ml/opik"
description = "I'm poking at the Opik SDK config setup and there's a gap that's been bugging me. The setup flow handles API key, workspace, and server URL just fine, but there's no way to lock in a default projec..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:comet-ml-opik-6093"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "2/8"
category = "Data Querying and Databases"
subcategory = "Analytical queries"
objective_labels = ["Fix"]
