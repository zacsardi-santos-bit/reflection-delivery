schema_version = "1.3"
source = "https://github.com/quarkusio/quarkus/pull/38410"
source_type = "pr"

[task]
name = "quarkusio/quarkus"
description = "I'm hitting a weird CSRF bug with the reactive HTTP extension in Quarkus and I could use your help. So CSRF validation works totally fine for my form-based POST endpoints, the token comes in as a f..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["java", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "1/8"
category = "Security"
subcategory = "Authentication and authorization"
objective_labels = ["Fix", "Secure or harden", "Validate"]
artifact_type_labels = ["Codebase", "Security artifact", "Network endpoint or protocol artifact"]
expert_time_estimate = 3600
junior_time_estimate = 10800
