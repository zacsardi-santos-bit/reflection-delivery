schema_version = "1.3"
source = "https://github.com/openai/codex/pull/15154"
source_type = "pr"

[task]
name = "openai/codex"
description = "I'm hitting a small but annoying rendering bug in the image generation flow. When the AI generates an image and saves it to disk, the chat history shows a \"Saved to:\" entry, but right now that line..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["rust", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:openai-codex-15154"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "4/13"
category = "Debugging and Repair"
subcategory = "Runtime bug repair"
objective_labels = ["Fix", "Implement"]
artifact_type_labels = ["Codebase", "Test suite or benchmark"]
expert_time_estimate = 3600
junior_time_estimate = 10800
