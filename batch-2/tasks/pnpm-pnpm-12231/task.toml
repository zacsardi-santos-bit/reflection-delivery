schema_version = "1.3"
source = "https://github.com/pnpm/pnpm/pull/12231"
source_type = "pr"

[task]
name = "pnpm/pnpm"
description = "I'm chasing a lockfile bug in our monorepo tooling. We've got projects that set their package manager requirement to a lenient policy, basically \"if the version doesn't match, ignore it and keep go..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:pnpm-pnpm-12231"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8>0)"
pass_at_k_opus_4_8 = "3/13"
category = "Software Engineering"
subcategory = "Feature implementation"
objective_labels = ["Implement", "Refactor", "Configure"]
artifact_type_labels = ["Codebase", "Configuration file"]
expert_time_estimate = 3600
junior_time_estimate = 10800
