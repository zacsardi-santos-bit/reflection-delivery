schema_version = "1.3"
source = "https://github.com/biomejs/biome/pull/9836"
source_type = "pr"

[task]
name = "biomejs/biome"
description = "I'm cleaning up Biome's ESLint migration tool and hitting a bunch of rules that just get dropped or lose their options when I convert a config over. Basically if someone's got jest, vitest, jsx-a11..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["rust", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:biomejs-biome-9836"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
objective_labels = ["Implement", "Test", "Migrate"]
artifact_type_labels = ["Codebase", "Test suite or benchmark", "Configuration file", "Text or log file"]
expert_time_estimate = 7200
junior_time_estimate = 21600
