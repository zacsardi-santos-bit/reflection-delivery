schema_version = "1.3"
source = "https://github.com/tailcallhq/tailcall/pull/987"
source_type = "pr"

[task]
name = "tailcallhq/tailcall"
description = "I'm swapping the JWT library in our Rust auth code over to the SurrealDB-maintained fork of that same crate, mostly for ecosystem alignment so we don't hit weird compatibility issues when SurrealDB..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["rust", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:tailcallhq-tailcall-987"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8=0)"
pass_at_k_opus_4_8 = "0/8"
category = "Security"
subcategory = "Authentication and authorization"
objective_labels = ["Migrate", "Configure", "Secure or harden"]
artifact_type_labels = ["Codebase", "Build system or package metadata", "Security artifact"]
expert_time_estimate = 3600
junior_time_estimate = 10800
