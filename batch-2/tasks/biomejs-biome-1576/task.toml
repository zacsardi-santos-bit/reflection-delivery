schema_version = "1.3"
source = "https://github.com/biomejs/biome/pull/1576"
source_type = "pr"

[task]
name = "biomejs/biome"
description = "I'm moving a project off Prettier and onto Biome using the migration command and I noticed my ignore patterns just vanish. I've got a `.prettierignore` with a pile of glob patterns for build dirs, ..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["rust", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:biomejs-biome-1576"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "hard"
difficulty_explanation = "hard: not solved by opus-4.8 (pass@8 = 0)"
pass_at_k_opus_4_8 = "0/8"
category = "Data Processing and ETL"
subcategory = "File format parsing and serialization"
objective_labels = ["Implement"]
artifact_type_labels = ["Configuration file", "Single script or program"]
expert_time_estimate = 3600
junior_time_estimate = 10800
