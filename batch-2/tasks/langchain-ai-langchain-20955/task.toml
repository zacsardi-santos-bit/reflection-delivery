schema_version = "1.3"
source = "https://github.com/langchain-ai/langchain/pull/20955"
source_type = "pr"

[task]
name = "langchain-ai/langchain"
description = "I'm trying to wire SambaNova's AI inference into my LangChain app and it's kind of a pain right now because there's no native support at all. They've got two separate platforms I care about: Sambav..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
docker_image = "us-east1-docker.pkg.dev/mercor-dashboard/swe-bench-gcp/harbor-batch-2:langchain-ai-langchain-20955"
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "no-network"
allowed_hosts = []
allow_internet = false

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "1/8"
category = "Machine Learning and AI"
subcategory = "ML serving and deployment"
objective_labels = ["Implement", "Configure"]
artifact_type_labels = ["Codebase", "Network endpoint or protocol artifact"]
expert_time_estimate = 3600
junior_time_estimate = 10800
