schema_version = "1.3"
source = "https://github.com/google-gemini/gemini-cli/pull/26868"
source_type = "pr"

[task]
name = "google-gemini/gemini-cli"
description = "I'm working on the text-search feature and the way we resolve the search binary is too brittle. Right now it only looks for a bundled copy, and if that's missing the whole feature just dies instead..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["typescript", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Security"
subcategory = "Security hardening"
objective_labels = ["Implement", "Secure or harden", "Fix"]
artifact_type_labels = ["Codebase", "Single script or program"]
expert_time_estimate = 7200
junior_time_estimate = 21600
