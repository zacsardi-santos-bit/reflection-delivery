schema_version = "1.3"
source = "https://github.com/home-assistant/core/pull/168231"
source_type = "pr"

[task]
name = "home-assistant/core"
description = "I'm adding diagnostics support to the Duco ventilation integration for Home Assistant, since right now if someone's device is acting up there's no clean way to pull a report through the built-in HA..."
authors = [{ name = "Mercor", email = "delivery@mercor.com" }]
keywords = ["python", "swe"]
metadata = { vendor = "Mercor" }

[environment]
os = "linux"
cpus = 1
memory_mb = 4096
storage_mb = 10240
build_timeout_sec = 1800
gpus = 0
gpu_types = []
workdir = "/workspace"
network_mode = "network"
allowed_hosts = []
allow_internet = true

[agent]
timeout_sec = 3000

[verifier]
timeout_sec = 3000

[solution]

[metadata]
difficulty = "medium"
difficulty_explanation = "medium: solvable by a frontier model (opus-4.8 pass@8 > 0)"
pass_at_k_opus_4_8 = "4/8"
category = "Systems, Infrastructure, and Operations"
subcategory = "Logging, monitoring, and observability"
objective_labels = ["Implement"]
artifact_type_labels = ["Single script or program", "Codebase"]
expert_time_estimate = 3600
junior_time_estimate = 10800
